# ─── Claude Code プラグイン ───
# chezmoi apply 時に run_onchange スクリプトで自動インストール（dot_claude/run_onchange_install-plugins.sh.tmpl）
# 未登録のマーケットプレイスも自動登録される
#
# [[claude_marketplaces]] - Claude marketplace（プラグイン取得元）定義
#   name    - 登録marketplace名。ソースの .claude-plugin/marketplace.json の "name" と一致させること
#             （`claude plugin install <plugin>@<name>` の参照に使用）
#   source  - marketplaceソース（owner/repo）
#
# [[claude_plugins]]      - Claude プラグイン定義
#   name        - プラグイン名
#   marketplace - 参照する claude_marketplaces の name
#   scope       - インストールスコープ: "user"(デフォルト), "project", "local"

[[claude_marketplaces]]
name = "claude-plugins-official"
source = "anthropics/claude-plugins-official"

[[claude_marketplaces]]
name = "openai-codex"
source = "openai/codex-plugin-cc"

[[claude_plugins]]
name = "code-review"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "commit-commands"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "context7"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "security-guidance"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "claude-md-management"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "feature-dev"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "code-simplifier"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "skill-creator"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "superpowers"
marketplace = "claude-plugins-official"

[[claude_plugins]]
name = "codex"
marketplace = "openai-codex"

# ─── Codex プラグイン ───
# Claude の [[claude_plugins]] とは別機構（`codex plugin` CLI）。設定先も ~/.codex で分離。
# chezmoi apply 時に dot_codex/run_onchange_install-plugins.sh.tmpl が自動実行。
#
# [[codex_marketplaces]] - Codex marketplace（プラグイン取得元）定義
#   name      - marketplace名。ソースの .agents/plugins/marketplace.json の "name" と一致させること
#               （`codex plugin add <plugin>@<name>` の参照・冪等判定・削除に使用）
#   source    - owner/repo / Git URL / ローカルパス（reserved=true の場合は不要）
#   ref       - git ref（任意。Gitソース時）
#   sparse    - sparse checkout パス（任意・複数可。Gitソース時）
#   reserved  - true の場合、Codex同梱の予約marketplace。`marketplace add` をスキップする
#               （例: "openai-curated"。`codex login` 後にバックエンドから配信される）
#
# [[codex_plugins]]      - Codex プラグイン定義
#   name        - プラグイン名（marketplace内の "name"）
#   marketplace - 参照する codex_marketplaces の name

# openai-curated は Codex 予約marketplace。`codex login` 後に利用可能になる。
[[codex_marketplaces]]
name = "openai-curated"
reserved = true

[[codex_plugins]]
name = "superpowers"
marketplace = "openai-curated"

[[codex_plugins]]
name = "build-web-apps"
marketplace = "openai-curated"

[[codex_plugins]]
name = "github"
marketplace = "openai-curated"
