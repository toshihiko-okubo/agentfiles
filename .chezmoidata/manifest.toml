# AI Agent Skills & Agents Manifest
# スキル・エージェントの追加・削除・バージョン変更はこのファイルを編集してください
#
# ─── フィールド説明 ───
#
# [repos.*]        - GitHubリポジトリ定義（owner, name）
#
# [[skills]]       - スキル定義（ディレクトリ単位で取得）
#   name           - スキル名（インストール先ディレクトリ名）
#   repo           - repos.* のキー名
#   ref            - git tag / branch / commit SHA
#   path           - リポジトリ内のスキルディレクトリパス
#   targets        - インストール先 ["codex"], ["claude"], ["codex","claude"]
#   refreshPeriod  - branch追跡時の再取得間隔（任意。例: "168h"）
#
# [[agents]]       - エージェント定義（単一.mdファイルとして取得）
#   name           - ファイル名（拡張子なし。配置先: ~/.claude/agents/{name}.md）
#   repo           - repos.* のキー名
#   ref            - git tag / branch / commit SHA
#   path           - リポジトリ内の.mdファイルパス
#   targets        - インストール先 ["claude"]
#   refreshPeriod  - 任意
#
# [[plugins]]      - Claude Code プラグイン定義（chezmoi apply 時に自動インストール）
#   name           - プラグイン名
#   marketplace       - レジストリ名（例: "anthropics/claude-plugins-official"）
#   scope          - インストールスコープ: "user"(デフォルト), "project", "local"

# ─── リポジトリ定義 ───

[repos.openai-skills]
owner = "openai"
name = "skills"

[repos.vercel-labs-skills]
owner = "vercel-labs"
name = "skills"

[repos.agency-agents]
owner = "msitarzewski"
name = "agency-agents"

# ─── スキル定義（ディレクトリ単位） ───
# openai/skills: https://github.com/openai/skills/tree/main/skills
#
# [[skills]]
# name = "vercel-deploy"
# repo = "openai-skills"
# ref = "main"
# path = "skills/.curated/vercel-deploy"
# targets = ["codex", "claude"]
# refreshPeriod = "168h"

[[skills]]
name = "plugin-creator"
repo = "openai-skills"
ref = "main"
path = "skills/.system/plugin-creator"
targets = ["codex", "claude"]
refreshPeriod = "168h"

[[skills]]
name = "skill-creator"
repo = "openai-skills"
ref = "main"
path = "skills/.system/skill-creator"
targets = ["codex", "claude"]
refreshPeriod = "168h"

[[skills]]
name = "skill-installer"
repo = "openai-skills"
ref = "main"
path = "skills/.system/skill-installer"
targets = ["codex", "claude"]
refreshPeriod = "168h"

[[skills]]
name = "find-skills"
repo = "vercel-labs-skills"
ref = "main"
path = "skills/find-skills"
targets = ["codex", "claude"]
refreshPeriod = "168h"

# ─── エージェント定義（単一.mdファイル） ───
# agency-agents: https://github.com/msitarzewski/agency-agents
# カテゴリ: engineering/, design/, product/, testing/, support/,
#           marketing/, sales/, project-management/, strategy/,
#           specialized/, integrations/, spatial-computing/, game-development/
#
# 単一ファイル: path が .md で終わる → file取得
